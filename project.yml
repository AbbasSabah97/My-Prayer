name: MyPrayer
options:
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: '5.0'
    IPHONEOS_DEPLOYMENT_TARGET: '16.0'
    CODE_SIGN_STYLE: Automatic
packages:
  Adhan:
    url: https://github.com/batoulapps/adhan-swift.git
    from: 1.5.0
targets:
  MyPrayer:
    type: application
    platform: iOS
    sources:
      - path: MyPrayer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.abbassabah.myprayer
        PRODUCT_NAME: MyPrayer
        INFOPLIST_FILE: MyPrayer/Info.plist
        GENERATE_INFOPLIST_FILE: 'NO'
        TARGETED_DEVICE_FAMILY: '1'
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - package: Adhan
