name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "scripts/generate_android_tones.py"
      - ".github/workflows/build-android.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK platform
        run: |
          SDK_ROOT="$ANDROID_HOME"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1)"
          fi
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Generate notification sound resources
        run: python3 scripts/generate_android_tones.py
      - name: Run tests and build APK
        working-directory: android
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest :app:assembleDebug
      - name: Rename installable APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk MyPrayer-Android-1.6.1.apk
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: MyPrayer-Android-APK
          path: MyPrayer-Android-1.6.1.apk
          if-no-files-found: error
          retention-days: 30
