name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "scripts/generate_android_tones.py"
      - ".github/workflows/build-android.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Generate notification sound resources
        run: python3 scripts/generate_android_tones.py
      - name: Run tests and build APK
        working-directory: android
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest :app:assembleDebug
      - name: Rename installable APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk MyPrayer-Android-1.3.0.apk
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: MyPrayer-Android-APK
          path: MyPrayer-Android-1.3.0.apk
          if-no-files-found: error
          retention-days: 30
